[package]
name = "dora-test-utils"
version = "0.1.0"
edition = "2021"
description = "Testing utility library for the DORA framework — unit testing and integration testing support"
license = "Apache-2.0"
repository = "https://github.com/dora-rs/gsoc2026-dora-test-utils"
authors = ["SunSunSun689"]

[dependencies]
# CLI argument parsing for test binaries.
clap = { version = "4", features = ["derive"] }

# Error handling for test binaries.
eyre = "0.6"

# Serialization for SinkResult output.
serde = { version = "1", features = ["derive"] }

# DORA node API — the primary integration surface.
#
# A released version, not a git rev: the crate is meant to be consumable
# alongside a normal dora install, and a git dependency also makes it
# unpublishable. The `arrow-v59` feature exposes the `DoraArray` accessors
# and the `IntoArrow` impls for Arrow 59 arrays, both of which this crate
# needs since dora-rs/dora#3213 removed Arrow from the frozen public API.
dora-node-api = { version = "1.0.1", features = ["arrow-v59"] }

# Arrow: must match the major that dora links internally, so arrays cross
# the boundary without a conversion hop. dora 1.0.1 uses arrow 59.1.
arrow = "59"
arrow-json = "59"

# Tokio: async runtime used by DORA and our harness. The testing output
# channel is no longer a tokio type in dora's public API (dora-rs/dora#3239
# replaced the re-exports with opaque newtypes), so this is only needed for
# the runtime itself.
tokio = { version = "1", features = ["sync", "macros", "rt"] }

# serde_json: DORA outputs are serialized as JSON maps in integration
# testing mode; test code inspects them via serde_json::Value.
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
serial_test = "3"

[[bin]]
name = "echo-node"
path = "tests/fixtures/echo-node.rs"
test = false

[[bin]]
name = "classifier-node"
path = "src/bin/classifier_node.rs"

[[bin]]
name = "test-sink"
path = "src/bin/test-sink.rs"

[[bin]]
name = "test-source"
path = "src/bin/test_source.rs"

[[example]]
name = "demo_replay"
path = "examples/demo_replay.rs"
